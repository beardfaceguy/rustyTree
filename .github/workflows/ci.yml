name: CI

# Run on every push and PR. Cancel superseded runs on the same ref so
# rapid pushes don't queue forever.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        # `actions-rust-lang/setup-rust-toolchain` reads rust-toolchain.toml
        # and installs the channel + components specified there. We rely on
        # it rather than calling rustup ourselves because the GitHub-hosted
        # runners' rustup version drifts: `rustup show active-toolchain
        # --install` is rustup 1.28+ syntax, but older runners reject the
        # `--install` flag and CI breaks with no code change. Using a
        # maintained action insulates us from that drift.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    # Runs cargo clippy + cargo test + cargo build --release on every
    # supported OS. Keeping clippy in this matrix (rather than only on
    # Linux) catches platform-conditional lints in src/scan/platform.rs and
    # other cfg-gated code that only Windows/macOS see.
    name: clippy + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux eframe build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Install pinned Rust toolchain
        # See note in the fmt job — using the maintained action so we
        # don't get bitten by rustup version drift across runner OSes.
        # `setup-rust-toolchain@v1` runs Swatinem/rust-cache internally
        # by default (cache: true), so we don't add a separate cache
        # step — that would duplicate work with a different key.
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --release
        run: cargo build --workspace --release
