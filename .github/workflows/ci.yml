name: CI

# Run on every push and PR. Cancel superseded runs on the same ref so
# rapid pushes don't queue forever.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # GitHub-hosted runners ship with rustup preinstalled. `rustup show
        # active-toolchain` materialises the channel + components named in
        # rust-toolchain.toml at the repo root, which is the single source
        # of truth for the toolchain version and components.
        run: rustup show active-toolchain

      - name: cargo fmt --check
        run: cargo fmt --all --check

  test:
    # Runs cargo clippy + cargo test + cargo build --release on every
    # supported OS. Keeping clippy in this matrix (rather than only on
    # Linux) catches platform-conditional lints in src/scan/platform.rs and
    # other cfg-gated code that only Windows/macOS see.
    name: clippy + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux eframe build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Install pinned Rust toolchain
        # See note in the fmt job: rust-toolchain.toml is the single
        # source of truth for both channel and components.
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --release
        run: cargo build --workspace --release
