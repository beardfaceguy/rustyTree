[workspace]
resolver = "2"
members = [
    "crates/rustytree-core",
    "crates/rustytree-gui",
    "crates/rustytree-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/rustyTree"
description = "Cross-platform GUI/CLI disk-usage analyzer in Rust, modeled after JAM Software TreeSize."

# Versions for crates shared between front-ends and the core library are pinned
# here so that bumping one place updates every member. Front-end-specific
# dependencies (eframe, rfd, ratatui, crossterm) live in the consuming crate.
[workspace.dependencies]
rustytree-core = { path = "crates/rustytree-core" }

chrono = "0.4.44"
humansize = "2.1.3"
thiserror = "2.0.18"
jwalk = "0.8.1"
tempfile = "3.27.0"
